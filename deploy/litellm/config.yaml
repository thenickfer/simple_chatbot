# LiteLLM Proxy Configuration
# Docs: https://docs.litellm.ai/docs/proxy/quick_start

model_list:
  # Primary model alias for the GPU Assistant desktop app
  - model_name: gpu-assistant
    litellm_params:
      model: ollama_chat/${OLLAMA_MODEL:-qwen2.5:3b}
      api_base: ${OLLAMA_API_BASE:-http://ollama:11434}
      stream: false

  # Optional fallback / alternate hosted models (uncomment and supply API key in .env if desired):
  # - model_name: gpu-assistant-cloud
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: ${LITELLM_MASTER_KEY:-sk-local-gpu-assistant}

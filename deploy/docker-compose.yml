services:
  ollama:
    image: ollama/ollama:latest
    container_name: gpu_assistant_ollama
    restart: unless-stopped
    profiles: ["test"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=15m
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Optional GPU-accelerated profile for hosts with NVIDIA container toolkit installed
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: gpu_assistant_ollama_gpu
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot model pull service that automatically pulls the configured model into Ollama on startup
  ollama-pull:
    image: ollama/ollama:latest
    container_name: gpu_assistant_ollama_pull
    restart: "no"
    profiles: ["test"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "if [ \"${OLLAMA_PULL:-true}\" = \"true\" ]; then echo 'Pulling ${OLLAMA_MODEL:-qwen2.5:3b}...'; ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}; else echo 'OLLAMA_PULL=false, skipping model pull'; fi"]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: gpu_assistant_litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-gpu-assistant}
      - LITELLM_UPSTREAM_MODEL=${LITELLM_UPSTREAM_MODEL:-ollama_chat/${OLLAMA_MODEL:-qwen2.5:3b}}
      - LITELLM_UPSTREAM_API_BASE=${LITELLM_UPSTREAM_API_BASE-http://ollama:11434}
      - LITELLM_UPSTREAM_API_KEY=${LITELLM_UPSTREAM_API_KEY:-none}
      - LITELLM_LOCAL_OLLAMA_MODEL=ollama_chat/${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_API_BASE=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-none}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-none}
      - GROQ_API_KEY=${GROQ_API_KEY:-none}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-none}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ollama_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
